version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: '3.13'
  apt_packages:
    - librsvg2-bin
  jobs:
    post_install:
      - sphinx-apidoc -ePT --remove-old -o docs/api flexget

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
