name: Convert magnet in Docker
on:
  pull_request:
jobs:
  convert-magnet:
    runs-on: ubuntu-latest
    container: flexget/flexget
    steps:
      - run: |
          cat > config.yml <<'EOF'
          tasks:
            convert_magnet:
              accept_all: yes
              mock:
                - { title: "ubuntu-26.04.1", url: "magnet:?xt=urn:btih:5b1e0d988fc7a0c9e99bd852071681a59974b39f" }
              convert_magnet: yes
          EOF
      - run: flexget execute
      - run: ls converted
