name: autofix.ci
on:
  push:
    branches: [develop]
    paths: &paths
      - .github/workflows/autofix-uv.lock.yml
      - pyproject.toml
      - uv.lock
  pull_request:
    paths: *paths
permissions: {}
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number || github.ref || github.run_id }}
  cancel-in-progress: true
env:
  UV_VERSION: 0.11.26 # renovate: datasource=pypi depName=uv
jobs:
  uv-lock:
    name: synchronize uv.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run uv lock
        run: uv lock
      - name: Autofix
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1
