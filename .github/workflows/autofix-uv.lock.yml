name: autofix.ci
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/autofix-uv.lock.yml
      - pyproject.toml
      - uv.lock
  pull_request:
    paths:
      - .github/workflows/autofix-uv.lock.yml
      - pyproject.toml
      - uv.lock
permissions: {}
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number || github.ref || github.run_id }}
  cancel-in-progress: true
env:
  UV_VERSION: 0.9.21 # renovate: datasource=pypi depName=uv
jobs:
  uv-lock:
    name: synchronize uv.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run uv lock
        run: uv lock
      - name: Autofix
        uses: autofix-ci/action@635ffb0c9798bd160680f18fd73371e355b85f27 # v1
