name: autofix.ci
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/autofix-uv.lock.yml
      - pyproject.toml
      - uv.lock
  pull_request:
    paths:
      - .github/workflows/autofix-uv.lock.yml
      - pyproject.toml
      - uv.lock
permissions: {}
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number || github.ref || github.run_id }}
  cancel-in-progress: true
env:
  UV_VERSION: 0.9.28 # renovate: datasource=pypi depName=uv
jobs:
  uv-lock:
    name: synchronize uv.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run uv lock
        run: uv lock
      - name: Autofix
        uses: autofix-ci/action@7a166d7532b277f34e16238930461bf77f9d7ed8 # v1
