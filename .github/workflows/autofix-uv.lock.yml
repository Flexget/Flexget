name: autofix.ci
on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/autofix-uv.lock.yml
      - pyproject.toml
      - uv.lock
  pull_request:
    paths:
      - .github/workflows/autofix-uv.lock.yml
      - pyproject.toml
      - uv.lock
permissions: {}
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number || github.ref || github.run_id }}
  cancel-in-progress: true
env:
  UV_VERSION: 0.9.16 # renovate: datasource=pypi depName=uv
jobs:
  uv-lock:
    name: synchronize uv.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244 # v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run uv lock
        run: uv lock
      - name: Autofix
        uses: autofix-ci/action@635ffb0c9798bd160680f18fd73371e355b85f27 # v1
