name: ci
on:
  pull_request:
  merge_group:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  test:
    uses: $/.github/workflows/test.yml
  docker:
    permissions:
      packages: write # to push to ghcr.io
      id-token: write # for signing attestations and cache entries with GitHub OIDC
    uses: $/.github/workflows/docker.yml
  required-checks-passed:
    name: required checks passed
    if: always()
    needs:
      - test
      - docker
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs passed
        run: |
          failing=$(
            echo "$NEEDS_JSON" | jq -r '
              to_entries[]
              | select(.value.result != "success" and .value.result != "skipped")
              | "\(.key): \(.value.result)"
            '
          )
          if [ -n "$failing" ]; then
            echo "$failing"
            exit 1
          fi
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
